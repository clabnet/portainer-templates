services:
  postgresql:
    image: ghcr.io/immich-app/postgres:16-vectorchord0.5.3
    container_name: postgresql
    hostname: postgresql
    restart: unless-stopped
    networks:
      - horizon_network
    ports:
      - ${POSTGRES_PORT:-5433}:5432
    volumes:
      - /Volume1/public/config/postgresql:/var/lib/postgresql/data:rw
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    env_file:
      - path: /Volume1/public/config/postgresql/.env
        required: false
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, pg_isready, -q, -d, "${POSTGRES_DB:-postgres}", -U, "${POSTGRES_USER:-postgres}"]
      timeout: 45s
      interval: 10s
      retries: 10
    labels:
      - com.centurylinklabs.watchtower.monitor-only=true
