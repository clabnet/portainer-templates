services:
  invoicerr:
    image: ghcr.io/impre-visible/invoicerr:v1.3.0-debug
    container_name: invoicerr
    restart: unless-stopped
    networks:
      - horizon_network
    ports:
      - 8020:80
    environment:
      # Required for email features
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}

      # OIDC Configuration (example for Authentik), and DATABASE_URL, APP_URL,
      # CORS_ORIGINS, SMTP_HOST/USER/FROM/PASSWORD, JWT_SECRET - all provided
      # via env_file below, not interpolated here (no compose-side default).
    env_file:
      - path: /Volume1/public/config/invoicerr/.env
        required: false
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:80/]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
