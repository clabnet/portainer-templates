services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    hostname: jellyfin
    restart: unless-stopped
    networks:
      - horizon_network
    ports:
      - 8096:8096
    volumes:
      - /Volume1/public/config/jellyfin/config:/config
      - /Volume1/public/config/jellyfin/cache:/cache
      - /Volume1/media:/media
    environment:
      - TZ=${TZ:-Europe/Rome}
    env_file:
      - path: /Volume1/public/config/jellyfin/.env
        required: false
    user: 1002:1002
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8096/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: local
      options:
        max-size: 50m
        max-file: "10"
    labels:
      - com.centurylinklabs.watchtower.enable=true
